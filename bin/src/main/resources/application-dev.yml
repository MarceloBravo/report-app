spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/report_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true
  sql:
    init:
      mode: always
      data-locations: classpath:db/seed-plan-gratuito.sql

springdoc:
  swagger-ui:
    enabled: true
  api-docs:
    enabled: true